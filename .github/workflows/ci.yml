---
name: CI
on:
  schedule:
    - cron: '0 0 * * 1'
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for progressive mode to work
      - name: Run ansible-lint
        uses: ansible/ansible-lint@v25.8.2

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - rockylinux9
          - ubuntu2404
          - ubuntu2204
          - ubuntu2004
          - debian12
          - debian11
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies.
        run: pip3 install ansible==9.13.0 molecule molecule-plugins[docker] docker

      - name: Run Molecule tests.
        run: molecule test
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}

  molecule-mac:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-14
          - macos-15
        include:
          - os: macos-14
            arch: intel
          - os: macos-15
            arch: arm
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies.
        run: pip3 install ansible==9.13.0 molecule==24.12.0

      - name: Run Molecule tests.
        run: molecule test -s macos

  molecule-win:
    name: molecule-win
    runs-on: windows-2022
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4

      - uses: devops37/ssh-win-from-wsl@v2

      - name: Install Python3 on wsl
        shell: wsl-bash {0}
        run: |
          sudo apt-get update
          sudo apt-get -y install python3 python3-pip
          python3 -m pip install --break-system-packages ansible==9.13.0 molecule==24.12.0

      - name: Run Molecule tests.
        shell: wsl-bash {0}
        run: |
          ip route show
          cat /etc/resolv.conf
          RUNNER_IP=$(ip route show | grep -i default | awk '{ print $3}')
          echo $RUNNER_IP
          sed -i "s/RUNNER_IP/$RUNNER_IP/g" molecule/windows/molecule.yml
          pwd
          ip a
          molecule test -s windows
